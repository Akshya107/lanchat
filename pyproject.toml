[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-chat"
version = "1.0.0"
description = "Peer-to-peer ephemeral LAN chat. Messages stay in RAM."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "zeroconf>=0.131,<1",
  "prompt_toolkit>=3.0.43,<4",
  "ifaddr>=0.1.7",
  "paho-mqtt>=1.6.1,<3",
  "websocket-client>=1.6.0",
]

[project.scripts]
lanchat = "ephemeral_chat.app:main"
ephemeral-chat = "ephemeral_chat.app:main"

[tool.setuptools.packages.find]
include = ["ephemeral_chat*"]
